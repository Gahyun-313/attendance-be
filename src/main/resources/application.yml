spring:
  application:
    name: attendance-backend

  # 기본 프로파일 설정 (로컬 개발용)
  profiles:
    active: local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update  # 엔티티 변경시 자동으로 테이블 구조 업데이트
    show-sql: true      # 실행되는 SQL 쿼리 콘솔에 출력
    properties:
      hibernate:
        format_sql: true  # SQL 포맷팅
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

logging:
  level:
    com.attendance: DEBUG
    org.springframework.security: DEBUG