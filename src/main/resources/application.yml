spring:
  application:
    name: attendance-backend

  # 기본 프로파일 설정 (로컬 개발용)
  profiles:
    active: local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # 스키마는 Flyway가 관리, Hibernate는 검증만
    show-sql: true      # 실행되는 SQL 쿼리 콘솔에 출력
    properties:
      hibernate:
        format_sql: true  # SQL 포맷팅

  flyway:
    baseline-on-migrate: true  # 기존 DB는 V1을 재실행하지 않고 baseline으로 표시
    baseline-version: 1

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

logging:
  level:
    com.attendance: DEBUG
    org.springframework.security: DEBUG