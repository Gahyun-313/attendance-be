# 컨테이너(Docker/AWS) 실행용 프로파일.
# application-local.yml과 달리 값을 코드에 고정하지 않고 전부 환경변수로 받는다 -
# 같은 이미지를 로컬 docker-compose에서도, 나중 AWS EC2에서도 그대로 재사용하기 위함
# (달라지는 건 "어떤 값을 주입하느냐"뿐, 이미지/코드는 안 바뀜).
spring:
  datasource:
    # allowPublicKeyRetrieval=true: MySQL 8 기본 인증(caching_sha2_password)이 비밀번호 암호화를 위해
    # 서버 공개키를 요구하는데, JDBC 드라이버가 기본적으로는 이 요청을 거부한다(중간자 공격 방지 목적의
    # 기본값). 로컬 개발 DB처럼 신뢰할 수 있는 환경에서 명시적으로 허용해줘야 연결이 된다.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:attendance}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # local은 update(자동 스키마 반영)지만, 운영은 validate로 - 엔티티와 실제 스키마가
      # 다르면 자동으로 고치지 않고 기동 자체를 실패시켜서, 의도치 않은 스키마 변경 사고를 막는다.
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# JWT_SECRET은 기본값을 주지 않는다 - 값이 없으면 앱이 기동 자체를 실패하게 해서,
# "비밀키를 안 채운 채로 배포"되는 사고를 막기 위한 의도적인 설계.
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# 구글 소셜 로그인 - client-id도 기본값 없이 필수 환경변수로 (틀린 값으로 배포되는 것을 방지)
oauth:
  google:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID}

logging:
  level:
    com.attendance: INFO
    org.springframework.security: WARN