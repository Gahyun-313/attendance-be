# 테스트 환경 - src/main/resources/application.yml을 대체(shadow)하므로 필요한 설정을 함께 포함해야 함
# (Gradle 테스트 클래스패스에서 test 리소스가 main보다 먼저 잡혀 동일 파일명은 덮어써짐)
spring:
  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: create-drop  # H2에는 Flyway 대신 Hibernate 자동 생성 사용
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false  # MySQL 전용 마이그레이션을 H2에 실행하지 않도록 비활성화

firebase:
  enabled: false  # 테스트 환경엔 실제 Firebase 자격증명이 없으므로 FirebaseConfig 빈 자체를 생성하지 않음
